name: Source validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patstack-${{ gitea.ref }}
  cancel-in-progress: ${{ gitea.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install validator dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate catalog, provenance, resources and syntax
        run: python -B scripts/validate.py --source-only
      - name: Test installer and selection safeguards in disposable fixtures
        run: python -B -m unittest discover -s tests -v
