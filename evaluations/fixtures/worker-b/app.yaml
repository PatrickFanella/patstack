apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-app
spec:
  template:
    spec:
      containers:
        - name: app
        image: example.invalid/eval-app:1
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
